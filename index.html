<style>
/* Layout: one-column phone app. Dark plum ground, hot pink accent. Time-ordered rail timeline is the hero, bottom tab bar for navigation. */
:root{
  padding-top:env(safe-area-inset-top,0px);
  --bg:#0e0a12; --card:#1a1222; --card2:#251a30; --line:#392946;
  --fg:#f8eff6; --muted:#ab99b7; --dim:#76667f;
  --pink:#ff4d94; --pink2:#ff8dbf; --pinkbg:rgba(255,77,148,.15);
  --good:#5fe3a1; --warn:#ffc25c; --orange:#ff9a5c; --bad:#ff6b7a; --violet:#b9a2ff; --amber:#ffb86b; --teal:#7fd6e8;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;font:16px/1.45 var(--f-body);color:var(--fg);background-color:var(--bg);-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70% 38% at 50% -8%,rgba(255,77,148,.20),transparent 70%)}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.bare{padding-bottom:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .sm{font-size:14px} .dim{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px} .stack-s{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px var(--f-display)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-size:30px;line-height:1.1;font-weight:800;margin:4px 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pink);color:#1b0713}
.cd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cd span{font:500 13px var(--f-mono);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--pink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.hot{background:linear-gradient(160deg,rgba(255,77,148,.18),var(--card) 60%);border-color:rgba(255,77,148,.4)}
.row-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;background:var(--pinkbg);color:var(--pink2);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 20px;border-radius:16px;border:1.5px solid var(--pink);background:var(--pink);color:#1b0713;font:700 17px var(--f-body)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.soft{background:var(--pinkbg);border-color:transparent;color:var(--pink2)}
.btn.sm{width:auto;min-height:46px;padding:0 16px;font-size:15px;flex:none}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{background:none;border:0;color:var(--pink2);font-weight:600;padding:10px 0;text-align:left;min-height:44px}
.link.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--pink2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:600 16px var(--f-body)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#1b0713}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.opt b{font-size:18px} .opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--pink);background:var(--pinkbg)}
.opt.on b{color:var(--pink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbl{display:block;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.lbl:first-child{margin-top:0}
.inp{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:#130d19;color:var(--fg);font:16px var(--f-body)}
.inp.ta{padding:12px 14px;min-height:140px;line-height:1.5;resize:vertical}
.inp.tm{width:128px;flex:none}
.add-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.meal{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.meal .inp:not(.tm){flex:1;min-width:110px}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:22px;flex:none}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:#3a2c47;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--pink)} .sw.on::after{transform:translateX(20px)}
.sb{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:10px}
.exn{font:800 20px var(--f-display)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1}
.sb-tools{display:flex;gap:10px;align-items:flex-end}
.score{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 28px var(--f-display)}
.verdict{font:800 22px var(--f-display)}
.counts{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font:500 12px var(--f-mono);color:var(--muted)}
.note{background:rgba(255,194,92,.1);border:1px solid rgba(255,194,92,.35);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px}
.tl{margin:18px 0 8px}
.trow{display:grid;grid-template-columns:64px 18px 1fr;column-gap:8px;align-items:start}
.tm{font:500 13px var(--f-mono);color:var(--fg);padding-top:14px;text-align:right}
.tm small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.rail{position:relative;align-self:stretch}
.rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.rail i{position:absolute;left:3px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--k,var(--dim))}
.trow.on-done .rail i{background:var(--k)}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;margin-bottom:10px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.it.pin{min-height:46px;padding:8px 14px;background:transparent}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.txt em{font-style:normal;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tg{font:600 10.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--k,var(--muted));display:flex;align-items:center;gap:6px}
.tg::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k,var(--muted))}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none;color:transparent}
.ck svg{width:16px;height:16px}
.it.on{background:#150f1b}
.it.on .txt b{color:var(--dim);text-decoration:line-through}
.it.on .ck{background:var(--pink);border-color:var(--pink);color:#1b0713}
.trow.now .it{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,77,148,.16)}
.trow.gap .tm{padding-top:2px;color:var(--dim);font-size:11px}
.trow.gap .rail i{top:7px;width:8px;height:8px;left:5px;border-width:1.5px}
.gp{font-size:13px;color:var(--dim);padding:0 0 10px;min-height:22px}
.k-study{--k:var(--pink)} .k-tuition{--k:var(--violet)} .k-productive{--k:var(--good)} .k-relax{--k:var(--amber)} .k-heal{--k:var(--teal)} .k-habit{--k:var(--dim)} .k-fixed{--k:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,10,18,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;border:0;background:none;color:var(--dim);font-size:12px;font-weight:600;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--pink)}
.flow .fl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{background:none;border:0;color:var(--muted);font-weight:600;min-height:44px;padding:0}
.bar{display:flex;gap:5px;margin-bottom:26px}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--card2)} .bar i.on{background:var(--pink)}
.q{font-size:31px;line-height:1.12;font-weight:800;margin-bottom:8px}
.hint{color:var(--muted);margin-bottom:22px}
.actions{position:sticky;bottom:0;display:grid;gap:10px;margin-top:26px;padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(14,10,18,0),var(--bg) 28%)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font:500 11px var(--f-mono);color:var(--muted)}
.bars span{width:100%;border-radius:8px 8px 4px 4px;background:var(--pink);min-height:4px}
.meter{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--pink);border-radius:5px}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:60px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:17px;text-align:left}
.setrow span{color:var(--muted);font-size:13px;font-weight:400}
.dayrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--card2);border:1px solid var(--pink);padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw}
.rm li{margin:4px 0;font-size:15px} .rm ul{margin:8px 0 0;padding-left:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top{gap:10px}
.pchip{border:1px solid var(--line);background:var(--card);color:var(--pink2);border-radius:999px;padding:0 14px;min-height:38px;font:600 14px var(--f-body);max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#150f1b}
.chip.sm{min-height:38px;padding:0 14px;font-size:14px}
.plbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}

.dnav{display:flex;gap:8px;align-items:center;margin:4px 0}
.dnav .inp{text-align:center;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.stat b{font:800 28px var(--f-display);color:var(--pink2)} .stat span{font-size:12px;color:var(--muted);line-height:1.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal.head{margin-top:12px;font:500 11px var(--f-mono);color:var(--dim);text-align:center}
.cell{aspect-ratio:1;border:0;border-radius:10px;display:grid;place-items:center;font:600 13px var(--f-mono);color:#1b0713;min-width:0}
.cell.off{background:var(--card2);color:var(--dim)} .cell.fut{opacity:.35}
.cell.tdy{outline:2px solid var(--pink2);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.btnrow{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;min-height:56px}
.btnrow:first-child{border-top:0}
.mck{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;color:transparent;flex:none}
.mck.on{background:var(--pink);border-color:var(--pink);color:#1b0713} .mck svg{width:14px;height:14px}

.x.sm{width:36px;height:36px;font-size:17px;border-radius:10px}

.tab{font-size:11px}
.logh{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:54px;margin-top:8px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#150f1b;text-align:left}
.lrow.on{border-color:var(--pink);background:var(--pinkbg)}
.lrow.on .ck{background:var(--pink);border-color:var(--pink);color:#1b0713}
.stepper{display:flex;gap:6px}
.x[disabled]{opacity:.3}

.trend{width:100%;height:auto;margin-top:12px;display:block}
.trend .gl{stroke:var(--line);stroke-width:1}
.trend .gl.gt{stroke:var(--good);stroke-dasharray:3 4;opacity:.7}
.trend .ax{fill:var(--muted);font:500 9px var(--f-mono)}
.trend .ln{fill:none;stroke:var(--pink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.trend .area{fill:rgba(255,77,148,.14);stroke:none}
.trend .dot{stroke:var(--bg);stroke-width:2}

.chips.rng{gap:6px;flex-wrap:nowrap}.chips.rng .chip.sm{min-height:34px;padding:0 12px}
</style>

<body>

<div class="glow"></div>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){'use strict';
/*LOGIC-START*/
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const toMin=t=>{if(!t||typeof t!=='string')return 0;const p=t.split(':').map(Number);return (p[0]||0)*60+(p[1]||0);};
const fmtT=m=>{m=((Math.round(m)%1440)+1440)%1440;let h=Math.floor(m/60);const mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(mm)+' '+ap;};
const fmtDur=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return r?h+' h '+r+' min':h+' h';};
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayNum=iso=>{const p=iso.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000);};
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
const addDays=(iso,n)=>{const p=iso.split('-').map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+n));};

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function mkISO(y,m,d,today){if(y&&y<100)y+=2000;if(!y){y=Number(today.slice(0,4));if(y+'-'+pad(m)+'-'+pad(d)<today)y++;}return y+'-'+pad(m)+'-'+pad(d);}
function parseDatesheet(text,today){
  const out=[],MN='jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec';
  for(let line of String(text||'').split(/\n+/)){
    line=line.trim();if(!line)continue;
    let m,iso=null,rest=line;
    if((m=line.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){iso=mkISO(+m[3],+m[2],+m[1],today);rest=line.replace(m[0],' ');}
    else if((m=line.match(new RegExp('(\\d{1,2})(?:st|nd|rd|th)?[\\s\\-]*('+MN+')[a-z]*\\.?,?[\\s\\-]*(\\d{4})?','i')))){iso=mkISO(m[3]?+m[3]:0,MONTHS[m[2].toLowerCase()],+m[1],today);rest=line.replace(m[0],' ');}
    else if((m=line.match(new RegExp('('+MN+')[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s*(\\d{4})?','i')))){iso=mkISO(m[3]?+m[3]:0,MONTHS[m[1].toLowerCase()],+m[2],today);rest=line.replace(m[0],' ');}
    if(!iso)continue;
    rest=rest.replace(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thu(?:rs?)?|fri|sat|sun)\b/ig,' ')
      .replace(/\d{1,2}[:.]\d{2}\s*(am|pm)?(\s*(-|to)\s*\d{1,2}[:.]\d{2}\s*(am|pm)?)?/ig,' ')
      .replace(/\(\s*\d+\s*\)/g,' ').replace(/\b\d{3}\b/g,' ').replace(/[|,:;–—\-]+/g,' ').replace(/\s+/g,' ').trim();
    if(rest)out.push({name:rest,date:iso});
  }
  return out;
}

function freeWindows(from,to,blocks){
  if(to-from<15)return [];
  const b=blocks.filter(x=>x.end>from&&x.start<to).sort((p,q)=>p.start-q.start),w=[];let cur=from;
  for(const x of b){if(x.start>cur)w.push([cur,Math.min(x.start,to)]);cur=Math.max(cur,x.end);}
  if(cur<to)w.push([cur,to]);
  return w.filter(p=>p[1]-p[0]>=15);
}

const TPRI={high:3,med:1.4,low:0.5};
/* Topics planned on an earlier day but never ticked. They go to the front of the next day. */
function carriedIds(S,iso){
  const set=new Set();
  for(const k of Object.keys(S.days||{})){
    if(k>=iso)continue;
    const d=S.days[k];
    for(const it of (d.items||[])){
      if(it.kind==='study'&&!(d.checks||{})[it.key]){const m=String(it.key).match(/^(study|rev):(.+)$/);if(m)set.add(m[2]);}
    }
  }
  return set;
}
/* Picks n study slots. First the chapters you pinned for today, then by score. A chapter's score rises with its own priority, exam priority and nearness, carried-over work and its place in your list. Chapters marked Revise always get slots until you set them to Done. */
function allocate(S,iso,n,skip,carried,first){
  carried=carried||carriedIds(S,iso);
  const cands=[],units=[],cnt={},byId={};
  for(const ex of S.exams){
    const nS=ex.subjects.length;
    ex.subjects.forEach((sb,k)=>{
      const dl=sb.date||ex.date;let days=60;
      if(dl){days=daysBetween(iso,dl);if(days<=0)return;}
      const ord=1+0.25*(nS>1?(1-k/(nS-1)):0),base=ex.priority*(1+20/(days+1))*ord;
      units.push({ex,sb,base});
      for(const t of sb.topics){
        if(skip&&skip.has(t.id))continue;
        const tp=TPRI[t.pri]||1,car=carried.has(t.id),boost=car?2.5:1;
        let c=null;
        if(!t.done)c={mode:'new',ex,sb,topic:t,carried:car,score:base*tp*boost};
        else if(t.rev)c={mode:'rev',flagged:true,ex,sb,topic:t,carried:car,score:base*tp*boost*1.4};
        if(c){cands.push(c);byId[t.id]=c;}
      }
    });
  }
  const slots=[];
  const take=c=>{const i=cands.indexOf(c);if(i>=0)cands.splice(i,1);cnt[c.sb.id]=(cnt[c.sb.id]||0)+1;slots.push(c);};
  for(const id of (first||[])){if(slots.length>=n)break;const c=byId[id];if(c&&cands.indexOf(c)>=0){c.pinned=true;take(c);}}
  const flagged=cands.filter(c=>c.flagged).length+slots.filter(c=>c.flagged).length;
  const need=n>=2?Math.min(flagged,Math.max(1,Math.floor(n/3))):0;
  const hiN=()=>slots.filter(c=>c.topic&&c.topic.pri==='high').length;
  const hiWant=Math.min(cands.filter(c=>c.topic&&c.topic.pri==='high').length+hiN(),Math.ceil(n*0.55));
  while(slots.length<n){
    const left=n-slots.length,got=slots.filter(c=>c.flagged).length;
    let pool=(need-got)>=left?cands.filter(c=>c.flagged):cands;
    if(hiN()<hiWant){const hp=pool.filter(c=>c.topic&&c.topic.pri==='high');if(hp.length)pool=hp;}
    else{const nl=pool.filter(c=>!(c.topic&&c.topic.pri==='low'));if(nl.length)pool=nl;}
    let best=null,bs=-1;
    for(const c of pool){const sc=c.score/(1+0.35*(cnt[c.sb.id]||0));if(sc>bs){bs=sc;best=c;}}
    if(!best)break;
    take(best);
  }
  const rest=n-slots.length;
  if(rest>0&&units.length){const top=units.slice().sort((x,y)=>y.base-x.base)[0];for(let i=0;i<rest;i++)slots.push({mode:'prac',ex:top.ex,sb:top.sb,topic:null});}
  return slots;
}

function buildPlan(S,iso,iv,nowMin,carry){
  const R=S.routine,notes=[],wake=toMin(iv.wake);let sleep=toMin(iv.sleep);
  if(sleep<=wake+240)sleep+=1440;
  const blocks=[],add=o=>{blocks.push(o);return o;};
  const hard=()=>blocks.filter(b=>b.kind==='tuition'||b.kind==='fixed');
  add({key:'wake',type:'block',kind:'habit',label:'Wake up and get ready',sub:'',start:wake,end:wake+30});
  for(const c of (carry||[]))add(Object.assign({},c));
  for(const t of (iv.tuitions||[])){const tu=S.tuitions.find(x=>x.id===t.id);if(!tu)continue;const st=toMin(t.start);add({key:'tuition:'+t.id,type:'block',kind:'tuition',label:tu.name+' tuition',sub:'',start:st,end:st+(t.mins||60),tid:t.id});}
  for(const b of (iv.busy||[])){const st=toMin(b.start);add({key:'busy:'+b.id,type:'block',kind:'fixed',label:b.label||'Fixed plan',sub:'',start:st,end:st+(b.mins||60)});}
  for(const e of (iv.extras||[])){const st=toMin(e.start);add({key:'extra:'+e.id,type:'block',kind:e.kind||'fixed',label:e.label||'Extra',sub:'Added by you',start:st,end:st+(e.mins||30),extra:true});}
  for(const m of R.meals){
    if(!m.on)continue;
    let st=Math.max(toMin(m.time),wake+30);const len=m.mins||30;
    for(let g=0;g<5;g++){const c=hard().find(b=>st<b.end&&st+len>b.start);if(!c)break;st=c.end;}
    if(st>=sleep-30)continue;
    add({key:'meal:'+m.id,type:'block',kind:'habit',label:m.name,sub:'',start:st,end:st+len});
  }
  for(const md of R.meds){
    let t=toMin(md.time);if(t<wake)t=wake;if(t>sleep-5)t=sleep-5;
    const c=hard().find(b=>t<b.end&&t+5>b.start);if(c)t=Math.max(wake,c.start-5);
    add({key:'med:'+md.id,type:'pin',kind:'habit',label:md.name,sub:'Medicine',start:t,end:t+5});
  }
  add({key:'wind',type:'block',kind:'heal',label:'Wind down and lights out',sub:'Phone away, lights low',start:sleep-30,end:sleep});
  const from=Math.max(wake+30,nowMin!=null?Math.ceil(nowMin/15)*15:0),to=sleep-30;
  const pref={morning:[wake+30,720],afternoon:[720,1020],evening:[1020,to]};
  const carriedKeys=new Set((carry||[]).map(c=>c.key));
  const chosen=(iv.relax||[]).map(x=>{const o=typeof x==='string'?{id:x}:x,r=R.relax.find(q=>q.id===o.id);return r?Object.assign({},r,{pstart:o.start||'',pmins:o.mins||0}):null;}).filter(r=>r&&!carriedKeys.has('relax:'+r.id));
  const ord={productive:0,heal:1,relax:2};chosen.sort((a,b)=>((a.pstart?0:1)-(b.pstart?0:1))||(ord[a.kind]-ord[b.kind]));
  for(const r of chosen){
    const dur=r.pmins||r.mins||60;
    if(r.pstart){const s0=toMin(r.pstart),c0=hard().find(b=>s0<b.end&&s0+dur>b.start);if(c0)notes.push(r.name+' overlaps with '+c0.label+'.');add({key:'relax:'+r.id,type:'block',kind:r.kind,label:r.name,sub:fmtDur(dur),start:s0,end:s0+dur});continue;}
    const place=(pa,pb,len)=>{
      const wins=freeWindows(Math.max(from,pa),Math.min(to,pb),blocks);
      if(r.when==='evening'){for(let i=wins.length-1;i>=0;i--)if(wins[i][1]-wins[i][0]>=len)return wins[i][1]-len;}
      else for(const w of wins)if(w[1]-w[0]>=len)return w[0];
      return null;
    };
    const pr=pref[r.when]||pref.evening;
    let st=place(pr[0],pr[1],dur),len=dur;
    if(st==null)st=place(from,to,dur);
    if(st==null){const wins=freeWindows(from,to,blocks).sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]));if(wins.length&&wins[0][1]-wins[0][0]>=30){len=Math.min(dur,wins[0][1]-wins[0][0]);st=wins[0][0];}}
    if(st==null){notes.push('There was no room for '+r.name+' today.');continue;}
    add({key:'relax:'+r.id,type:'block',kind:r.kind,label:r.name,sub:fmtDur(len),start:st,end:st+len});
  }
  const N=Math.max(0,Math.round(iv.hours*60/55*(iv.energy==='low'?0.75:1)));
  const slotsT=[];
  for(const w of freeWindows(from,to,blocks)){
    let cur=w[0];
    while(slotsT.length<N&&w[1]-cur>=35){const len=Math.min(50,w[1]-cur);slotsT.push([cur,cur+len]);cur+=len+10;}
    if(slotsT.length>=N)break;
  }
  if(slotsT.length<N)notes.push('Only '+slotsT.length+' of '+N+' study sessions fit around your day.');
  const skipIds=new Set();for(const c of (carry||[])){const mm=String(c.key).match(/^(study|rev):(.+)$/);if(mm)skipIds.add(mm[2]);}
  const alloc=allocate(S,iso,slotsT.length,skipIds,null,iv.first||[]);
  if(slotsT.length&&!alloc.length)notes.push('Add your syllabus in Setup so these sessions get real chapters.');
  const nCar=alloc.filter(a=>a.carried).length;
  if(nCar)notes.push(nCar+(nCar===1?' unfinished session was':' unfinished sessions were')+' carried over from earlier days and moved to the front.');
  const nRev=S.exams.reduce((n,e)=>n+e.subjects.reduce((m,sb)=>m+sb.topics.filter(t=>t.rev).length,0),0);
  if(nRev)notes.push(nRev+(nRev===1?' chapter is':' chapters are')+' marked Revise. They keep coming back until you set them to Done.');
  const study=slotsT.map((s,i)=>{
    const a=alloc[i];
    if(!a)return {key:'study:gen'+i,type:'block',kind:'study',label:'Study session',sub:'Add your syllabus to name it',start:s[0],end:s[1]};
    const sub=(a.pinned?'Your pick \u00b7 ':'')+(a.carried?'Carried over \u00b7 ':'')+a.sb.name+' \u00b7 '+a.ex.name+(a.topic&&a.topic.pri==='high'?' \u00b7 High priority':'');
    if(a.mode==='new')return {key:'study:'+a.topic.id,type:'block',kind:'study',label:a.topic.name,sub,start:s[0],end:s[1]};
    if(a.mode==='rev')return {key:'rev:'+a.topic.id,type:'block',kind:'study',label:'Revise: '+a.topic.name,sub,start:s[0],end:s[1]};
    return {key:'prac:'+i,type:'block',kind:'study',label:'Practice questions',sub,start:s[0],end:s[1]};
  });
  const all=blocks.concat(study),pins=[];
  if(R.waterOn){let g=1;for(let t=wake+60;t<sleep-60;t+=R.waterEvery*60){pins.push({key:'water:'+g,type:'pin',kind:'habit',label:'Drink water',sub:'Glass '+g,start:t,end:t});g++;}}
  for(const p of pins){
    const c=all.find(b=>b.type==='block'&&p.start>b.start&&p.start<b.end);
    if(c){p.start=(p.start-c.start<=c.end-p.start)?c.start:c.end;p.end=p.start;}
  }
  const merged=all.concat(pins).sort((a,b)=>(a.start-b.start)||((a.type==='pin'?0:1)-(b.type==='pin'?0:1))||(a.end-b.end));
  const items=[];let prev=wake;
  for(const it of merged){
    if(it.start-prev>=10)items.push({key:'gap:'+prev,type:'gap',kind:'fixed',start:prev,end:it.start});
    items.push(it);prev=Math.max(prev,it.type==='pin'?it.start:it.end);
  }
  return {items,notes};
}

function scoreDay(day){
  if(!day||!day.items)return null;
  const ck=day.checks||{},nt=(day.night&&day.night.tu)||{},it=dayItems(day),by=f=>it.filter(f);
  const ratio=a=>a.length?a.filter(i=>ck[i.key]).length/a.length:null;
  const tu=by(i=>i.kind==='tuition');let tr=null;
  if(tu.length)tr=tu.reduce((s,i)=>{if(!ck[i.key])return s;const n=nt[i.tid],pl=Math.max(1,i.end-i.start);return s+(n&&n.mins!=null?Math.min(1,n.mins/pl):1);},0)/tu.length;
  const parts=[[50,ratio(by(i=>i.kind==='study'))],[20,tr],[20,ratio(by(i=>i.kind==='habit'||i.kind==='productive'))],[10,ratio(by(i=>i.kind==='relax'||i.kind==='heal'))]].filter(p=>p[1]!=null);
  if(!parts.length)return null;
  const tw=parts.reduce((s,p)=>s+p[0],0);
  return Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/tw*100);
}
const verdict=s=>s>=75?['Productive day','var(--good)']:s>=50?['Decent day','var(--warn)']:s>=25?['Slow day','var(--orange)']:['Off day','var(--bad)'];

function project(S,startIso,perDay){
  let last='';
  for(const ex of S.exams){if(ex.date>last)last=ex.date;for(const sb of ex.subjects)if(sb.date>last)last=sb.date;}
  const out={days:[],left:{}};if(!last)return out;
  const skip=new Set(),span=Math.min(200,Math.max(0,daysBetween(startIso,last)));
  for(let i=0;i<span;i++){
    const iso=addDays(startIso,i),slots=allocate(S,iso,perDay,skip),news=slots.filter(s=>s.mode==='new'||(s.mode==='rev'&&s.flagged));
    news.forEach(s=>skip.add(s.topic.id));
    out.days.push({iso,news:news.map(s=>({t:(s.mode==='rev'?'Revise: ':'')+s.topic.name,sb:s.sb.name,ex:s.ex.name})),extra:slots.length-news.length});
  }
  while(out.days.length&&!out.days[out.days.length-1].news.length)out.days.pop();
  for(const ex of S.exams)for(const sb of ex.subjects){
    const dl=sb.date||ex.date;if(dl&&dl<=startIso)continue;
    const n=sb.topics.filter(t=>!t.done&&!skip.has(t.id)).length;if(n)out.left[sb.id]=n;
  }
  return out;
}

  extraAgo(d){const n=nowInfo();ui.extra.start=fmtHM(Math.max(0,n.min-(+d.v)));},
  extraCancel(){ui.extra=null;ui.scroll=true;},
  extraSave(){const x=ui.extra,n=nowInfo(),day=S.days[n.iso];if(!day){ui.extra=null;toast('Plan today first');return;}const e={id:uid(),label:x.label.trim(),kind:x.kind,start:x.start,mins:x.mins};day.iv.extras=(day.iv.extras||[]).concat([e]);if(toMin(e.start)<=n.min)day.checks['extra:'+e.id]=true;replanDay(n.iso);ui.extra=null;ui.viewIso=n.iso;ui.tab='today';ui.scroll=true;toast('Added. Your day is re-planned.');},
  delExtra(d){const n=nowInfo(),day=S.days[n.iso];day.iv.extras=(day.iv.extras||[]).filter(e=>e.id!==d.id);delete day.checks['extra:'+d.id];replanDay(n.iso);toast('Removed. Day re-planned.');},
  delChap(d){for(const ex of S.exams)for(const sb of ex.subjects)sb.topics=sb.topics.filter(t=>t.id!==d.id);},
  addChap(d){const r=subj(d.id),el=$('#chapAdd-'+d.id);if(!r||!el)return;const have=new Set(r.sb.topics.map(t=>t.name.toLowerCase()));let n=0;for(const l of el.value.split('\n')){const nm=l.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s*/,'').trim();if(nm&&!have.has(nm.toLowerCase())){have.add(nm.toLowerCase());r.sb.topics.push({id:uid(),name:nm,done:false,rev:false,pri:'med'});n++;}}toast(n?'Added '+n+' chapters':'Nothing new to add');},
  resetAll(){if(arm('reset')){try{localStorage.removeItem(LS_KEY);}catch(e){}S=defaultState();ui.wiz={step:0};ui.edit=null;ui.scroll=true;}},
  startMorning(d){startMorning(d.iso);},
  startNight(d){startNight(d.iso);},
  tick(d){const iso=ui.viewIso,day=S.days[iso];day.checks[d.key]=!day.checks[d.key];syncTopic(d.key,day.checks[d.key],iso);},
  fnext(){ui.flow.step++;ui.scroll=true;},
  fback(){if(ui.flow.step>0)ui.flow.step--;else ui.flow=null;ui.scroll=true;},
  fset(d){flowD()[d.k]=d.v;},
  fhours(d){flowD().hours=+d.v;},
  fyn(d){flowD()[d.k]=d.v==='1';},
  ftu(d){const f=flowD(),i=f.tu.findIndex(x=>x.id===d.id);if(i>=0)f.tu.splice(i,1);else f.tu.push({id:d.id,start:'16:00',mins:120});},
  ftuStart(d){flowD().tu.find(x=>x.id===d.id).start=d.v;},
  ftuMins(d){flowD().tu.find(x=>x.id===d.id).mins=+d.v;},
  fbAdd(){flowD().busy.push({id:uid(),label:'',start:'10:00',mins:60});},
  fbDel(d){const f=flowD();f.busy=f.busy.filter(b=>b.id!==d.id);},
  fbMins(d){flowD().busy.find(b=>b.id===d.id).mins=+d.v;},
  frelax(d){const r=flowD().relax,i=r.findIndex(x=>x.id===d.id);if(i>=0)r.splice(i,1);else{const a=S.routine.relax.find(x=>x.id===d.id);r.push({id:d.id,start:a&&a.time?a.time:'',mins:a?a.mins:60});}},
  rlStart(d){const x=flowD().relax.find(y=>y.id===d.id);if(x)x.start=d.v;},
  rlMins(d){const x=flowD().relax.find(y=>y.id===d.id);if(x)x.mins=+d.v;},
  ffirst(d){const a=flowD().first,i=a.indexOf(d.id);if(i>=0)a.splice(i,1);else a.push(d.id);},
  nwent(d){const t=flowD().tu[d.id];t.went=d.v==='1';if(!t.went){t.mins=0;t.topics=[];}},
  nmins(d){flowD().tu[d.id].mins=+d.v;},
  ntopic(d){const a=flowD().tu[d.id].topics,i=a.indexOf(d.v);if(i>=0)a.splice(i,1);else a.push(d.v);},
  ntick(d){const a=flowD().tick,i=a.indexOf(d.key);if(i>=0)a.splice(i,1);else a.push(d.key);},
  nmood(d){flowD().mood=d.v;},
  fdone(d){if(ui.flow.kind==='morning')finishMorning();else finishNight(d.v==='1');}
};
const I={
  lpick(d,v){if(v){const n=nowInfo().iso;ui.logIso=v>n?n:v;}},
  extraLabel(d,v){ui.extra.label=v;const b=$('[data-a=extraSave]');if(b)b.disabled=!v.trim();},
  extraStart(d,v){if(v)ui.extra.start=v;},
  rlStartI(d,v){const x=flowD().relax.find(y=>y.id===d.id);if(x)x.start=v;},
  rlTime(d,v){const r=S.routine.relax.find(x=>x.id===d.id);if(r)r.time=v;},
  profName(d,v){const p=P.profiles.find(x=>x.id===d.id);if(p&&v.trim())p.name=v;},
  chName(d,v){const t=findTopic(d.id);if(t)t.name=v;},
  fileRestore(d,v,el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result));r.readAsText(f);},
  dpick(d,v){if(v)ui.viewIso=v;},
  exName(d,v){exam(d.id).name=v;},exDate(d,v){exam(d.id).date=v;},
  sbDate(d,v){subj(d.id).sb.date=v;},
  sbChap(d,v){const r=subj(d.id);setTopics(r.sb,v);const c=$('#cnt-'+d.id);if(c)c.textContent=r.sb.topics.filter(t=>t.done).length+'/'+r.sb.topics.length+' done';},
  tuName(d,v){S.tuitions.find(t=>t.id===d.id).name=v;},
  mealName(d,v){S.routine.meals.find(m=>m.id===d.id).name=v;},mealTime(d,v){if(v)S.routine.meals.find(m=>m.id===d.id).time=v;},
  medName(d,v){S.routine.meds.find(m=>m.id===d.id).name=v;},medTime(d,v){if(v)S.routine.meds.find(m=>m.id===d.id).time=v;},
  rlName(d,v){S.routine.relax.find(r=>r.id===d.id).name=v;},
  rt(d,v){if(v)S.routine[d.k]=v;},
  fv(d,v){if(v)flowD()[d.k]=v;},
  ftuStartI(d,v){if(v)flowD().tu.find(x=>x.id===d.id).start=v;},
  fbLabel(d,v){flowD().busy.find(b=>b.id===d.id).label=v;},fbStart(d,v){if(v)flowD().busy.find(b=>b.id===d.id).start=v;},
  nnote(d,v){flowD().tu[d.id].note=v;}
};

function render(){
  let h,tabs=false;
  if(ui.wiz)h=viewWizard();
  else if(ui.extra)h=viewExtra();
  else if(ui.flow)h=viewFlow();
  else if(ui.edit)h=viewEdit();
  else{h=({today:viewToday,log:viewLog,roadmap:viewRoadmap,progress:viewProgress,setup:viewSetup})[ui.tab]();tabs=true;}
  const app=$('#app');app.className='app'+(tabs?'':' bare');app.innerHTML=h+(tabs?tabsHTML():'');
  if(ui.scroll){window.scrollTo(0,0);ui.scroll=false;}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(!f)return;
  try{f(el.dataset,el);}catch(err){console.error(err);}
  save();render();
});
function onInput(e,fin){
  const el=e.target,i=el.dataset&&el.dataset.i;if(!i||!I[i])return;
  try{I[i](el.dataset,el.value,el);}catch(err){console.error(err);}
  save();if(fin&&el.dataset.r==='1')render();
}
document.addEventListener('input',e=>onInput(e,false));
document.addEventListener('change',e=>onInput(e,true));
setInterval(()=>{const a=document.activeElement;if(!ui.flow&&!ui.edit&&!ui.wiz&&ui.tab==='today'&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();},60000);
try{localStorage.setItem('pt.test','1');localStorage.removeItem('pt.test');}catch(e){storageOK=false;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=todayISO();if(ui.lastDay!==t){ui.lastDay=t;ui.viewIso=t;}render();}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
render();

})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
